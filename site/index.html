<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amsterdam Agenda</title>
<meta name="description" content="Alle events van mijn favoriete Amsterdamse podia in één agenda.">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d6402b'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Amsterdam&nbsp;Agenda</h1>
    <div class="view-toggle" role="tablist" aria-label="Weergave">
      <button role="tab" data-view="list" aria-selected="true">Lijst</button>
      <button role="tab" data-view="week" aria-selected="false">Week</button>
    </div>
  </div>
  <div class="chips" id="quick" aria-label="Periode">
    <button data-quick="all" class="on">Alles</button>
    <button data-quick="today">Vandaag</button>
    <button data-quick="weekend">Dit weekend</button>
    <button data-quick="week">Deze week</button>
    <button data-quick="fav">★ Favorieten</button>
  </div>
  <div class="chips" id="cats" aria-label="Categorie"></div>
  <div class="club-mode" role="radiogroup" aria-label="Clubavonden">
    <span>Clubs:</span>
    <button role="radio" data-club="on">Aan</button>
    <button role="radio" data-club="only">Alleen</button>
    <button role="radio" data-club="off">Uit</button>
  </div>
  <div class="filter-row">
    <input id="search" type="search" placeholder="Zoek artiest, titel…" autocomplete="off" enterkeyhint="search">
    <button id="venue-btn" class="venue-btn" aria-expanded="false" aria-controls="venue-panel">Locaties</button>
  </div>
  <div id="venue-panel" class="venue-panel" hidden>
    <div class="venue-actions">
      <button data-venues="all">Alles</button>
      <button data-venues="none">Niets</button>
      <button data-venues="fav">Alleen ★</button>
    </div>
    <ul id="venue-list"></ul>
  </div>
</header>

<main>
  <section id="series" class="series" hidden>
    <h2>Loopt nu</h2>
    <div class="series-scroll" id="series-list"></div>
  </section>
  <details id="weekly" class="weekly" hidden>
    <summary><span>Vaste prik</span> <small id="weekly-count"></small></summary>
    <div id="weekly-list"></div>
  </details>
  <p id="summary" class="summary" aria-live="polite"></p>
  <div id="list"></div>
  <div id="week" hidden>
    <div class="week-nav">
      <button id="prev-week" aria-label="Vorige week">‹</button>
      <span id="week-label"></span>
      <button id="next-week" aria-label="Volgende week">›</button>
    </div>
    <div class="week-grid" id="week-grid"></div>
  </div>
</main>

<footer class="foot">
  <p><a id="ics-link" href="events.ics">📅 Abonneer in je agenda (iCal)</a></p>
  <details>
    <summary id="status-summary">Bronnen</summary>
    <table id="status-table"><thead><tr><th>Locatie</th><th>Bijgewerkt</th><th>Events</th></tr></thead><tbody></tbody></table>
  </details>
</footer>

<template id="event-tpl">
  <article class="ev">
    <time class="ev-time"></time>
    <div class="ev-body">
      <a class="ev-title" target="_blank" rel="noopener"></a>
      <div class="ev-meta"><span class="ev-venue"></span><span class="ev-cat"></span><span class="ev-status"></span></div>
      <div class="ev-sub"></div>
    </div>
    <button class="star" aria-pressed="false" aria-label="Favoriet">☆</button>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
