name: Update agenda

on:
  schedule:
    # Monday 06:00 Europe/Amsterdam. Cron is UTC, so run at both 04:00 (summer, CEST)
    # and 05:00 (winter, CET); the "time guard" step lets only the right one through.
    - cron: "0 4 * * 1"
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "scrapers/**", "run.py", "ics.py", "build.py", "recurring.json", "instagram/events.json", ".github/workflows/update.yml"]

permissions:
  contents: write   # commit refreshed data/ back to the repo
  pages: write
  id-token: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Time guard (only 06:00 Amsterdam for scheduled runs)
        id: guard
        run: |
          hour=$(TZ=Europe/Amsterdam date +%H)
          echo "Amsterdam hour: $hour"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "06" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tests (parsers against saved fixtures)
        if: steps.guard.outputs.run == 'true'
        run: python -m pytest -q

      - name: Scrape
        if: steps.guard.outputs.run == 'true'
        run: python run.py --no-cache

      - name: Commit refreshed data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "agenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update agenda data $(TZ=Europe/Amsterdam date +%Y-%m-%d)"
          # main may have moved during the run (code pushes): rebase the data commit and retry.
          # Losing this commit would also lose the "keep previous events" fallback for next week.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            echo "push attempt $i failed, retrying"; sleep $((i * 10))
          done

      - name: Build site
        if: steps.guard.outputs.run == 'true'
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.run == 'true'
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.guard.outputs.run == 'true'
        uses: actions/deploy-pages@v4
